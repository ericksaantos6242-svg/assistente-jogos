name: Gerar APK de teste
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Preparar projeto Android
        shell: python
        run: |
          from pathlib import Path
          import json
          files = json.loads(
              '{"settings.gradle": "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\\nrootProject.name = \'AssistenteJogos\'\\ninclude \':app\'\\n", "build.gradle": "plugins { id \'com.android.application\' version \'8.7.3\' apply false }\\n", "README.md": "# Assistente de Jogos — Android\\n\\nProtótipo 0.1 para Erick: teste de captura autorizada da '
              'tela no próprio celular.\\n\\n## O que funciona nesta etapa\\n- Solicitação de consentimento do Android para cada sessão.\\n- Serviço de captura com notificação persistente e botão Parar.\\n- Recebimento e descarte imediato de quadros em memória; contador no aplicativo.\\n- Redimensionamento ao girar a tela ou selecionar outro tamanho de janela.\\n- Encerramento ao revogar a captura pelo Android. Sem reinício automático.\\n\\nAinda **não** oferece IA, reconhecimento de conteúdo, voz ou recomendações.\\nNã'
              'o solicita internet, microfone, acessibilidade ou armazenamento. Não salva imagens.\\nContar quadros não comprova conteúdo legível; jogos com proteção podem retornar preto.\\n\\n## Gerar no GitHub pelo celular\\n1. Abra a aba Actions e a execução `Gerar APK de teste`.\\n2. Aguarde o resultado verde. Se vermelho, abra `Verificar e construir` e compartilhe o erro.\\n3. Nos artefatos, baixe `assistente-jogos-0.1`. O GitHub pode empacotar o APK em ZIP; extraia pelo gerenciador de arquivos se necessário.\\n'
              '4. Abra o APK no celular e autorize a instalação para o aplicativo usado, se o Android solicitar.\\n\\nO APK usa assinatura de depuração para teste pessoal. A chave não é persistida entre execuções: uma atualização de teste pode exigir desinstalar a versão anterior. Não é distribuição de produção.\\n\\n## Teste no aparelho\\n1. Abra o app e inicie o teste. Cancelar a autorização não deve iniciar captura.\\n2. Autorize, preferindo compartilhar apenas o jogo se o Android oferecer a escolha.\\n3. Abra o j'
              'ogo por 10 segundos. Volte e confira se o contador aumentou.\\n4. Gire o aparelho durante uma sessão e confira se a captura continua.\\n5. Pare pelo aplicativo e depois teste parar pela notificação/indicador do Android.\\n6. Inicie uma nova sessão: o Android deve pedir consentimento novamente.\\n\\nO pipeline executa Android Lint e compilação. Testes de desempenho, bateria e comportamento no aparelho precisam ser feitos manualmente. Esta etapa prepara a integração posterior de voz e IA; provedor e cu'
              'sto ainda não definidos.\\n", ".gitignore": ".gradle/\\n**/build/\\nlocal.properties\\n*.jks\\n*.keystore\\n.idea/\\n", "app/build.gradle": "plugins { id \'com.android.application\' }\\nandroid {\\n    namespace \'br.com.erick.assistentejogos\'\\n    compileSdk 35\\n    defaultConfig {\\n        applicationId \'br.com.erick.assistentejogos\'\\n        minSdk 26\\n        targetSdk 34\\n        versionCode 1\\n        versionName \'0.1-teste\'\\n    }\\n    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targ'
              'etCompatibility JavaVersion.VERSION_17 }\\n}\\n", "app/src/main/AndroidManifest.xml": "<manifest xmlns:android=\\"http://schemas.android.com/apk/res/android\\">\\n    <uses-permission android:name=\\"android.permission.FOREGROUND_SERVICE\\" />\\n    <uses-permission android:name=\\"android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION\\" />\\n    <uses-permission android:name=\\"android.permission.POST_NOTIFICATIONS\\" />\\n    <application android:label=\\"Assistente de Jogos\\" android:theme=\\"@android:style'
              '/Theme.Material.NoActionBar\\" android:allowBackup=\\"false\\" android:supportsRtl=\\"true\\">\\n        <activity android:name=\\".MainActivity\\" android:exported=\\"true\\">\\n            <intent-filter><action android:name=\\"android.intent.action.MAIN\\"/><category android:name=\\"android.intent.category.LAUNCHER\\"/></intent-filter>\\n        </activity>\\n        <service android:name=\\".CaptureService\\" android:exported=\\"false\\" android:foregroundServiceType=\\"mediaProjection\\" />\\n    </application>\\n<'
              '/manifest>\\n", "app/src/main/java/br/com/erick/assistentejogos/MainActivity.java": "package br.com.erick.assistentejogos;\\n\\nimport android.Manifest;\\nimport android.app.*;\\nimport android.content.*;\\nimport android.content.pm.PackageManager;\\nimport android.graphics.Color;\\nimport android.media.projection.MediaProjectionManager;\\nimport android.os.*;\\nimport android.view.View;\\nimport android.widget.*;\\n\\npublic class MainActivity extends Activity {\\n    private final Handler handler = new Hand'
              'ler(Looper.getMainLooper());\\n    private TextView status;\\n    private Button start;\\n    private boolean requesting;\\n    private final Runnable refresh = new Runnable() {\\n        public void run() {\\n            status.setText(CaptureService.status + \\"\\\\nQuadros recebidos nesta sessão: \\" + CaptureService.frames);\\n            start.setEnabled(!CaptureService.active && !requesting);\\n            handler.postDelayed(this, 700);\\n        }\\n    };\\n    @Override public void onCreate(Bundle st'
              'ate) {\\n        super.onCreate(state);\\n        LinearLayout layout = new LinearLayout(this);\\n        layout.setOrientation(LinearLayout.VERTICAL);\\n        int pad = (int)(24 * getResources().getDisplayMetrics().density);\\n        layout.setPadding(pad,pad,pad,pad);\\n        layout.setBackgroundColor(Color.rgb(15,23,42));\\n        ScrollView scroll = new ScrollView(this);\\n        scroll.addView(layout); setContentView(scroll);\\n        text(layout,\\"ASSISTENTE DE JOGOS\\",14,Color.rgb(94,234,2'
              '12));\\n        text(layout,\\"Seu assessor de partida\\",30,Color.WHITE);\\n        text(layout,\\"Versão 0.1 • Teste de captura\\",16,Color.LTGRAY);\\n        text(layout,\\"Vamos verificar se o Android permite receber a imagem do jogo. Nesta versão ainda não há IA, voz nem dicas.\\",18,Color.WHITE);\\n        text(layout,\\"Os quadros são recebidos na memória e descartados. Nada é salvo ou enviado. O aplicativo não pede acesso à internet nem ao microfone.\\",16,Color.LTGRAY);\\n        status = text(layou'
              't,\\"Sessão parada\\",18,Color.rgb(94,234,212));\\n        start = button(layout,\\"Iniciar teste de tela\\");\\n        start.setOnClickListener(v -> {\\n            if (CaptureService.active || requesting) return;\\n            if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {\\n                requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 12);\\n            } else requestCapture();\\n        }'
              ');\\n        button(layout,\\"Parar sessão\\").setOnClickListener(v -> stopService(new Intent(this,CaptureService.class)));\\n        text(layout,\\"COMO TESTAR\\",14,Color.rgb(94,234,212));\\n        text(layout,\\"1. Toque em Iniciar e autorize no Android.\\\\n2. Se aparecer a escolha, selecione apenas o jogo.\\\\n3. Abra o jogo por alguns segundos.\\\\n4. Volte aqui: confira se o contador aumentou.\\\\n5. Toque em Parar sessão ou use a notificação.\\",17,Color.WHITE);\\n        text(layout,\\"Um contador aument'
              'ando confirma o recebimento de quadros; não garante que o conteúdo esteja legível. Telas protegidas podem aparecer pretas. Encerre a sessão antes de abrir conteúdo pessoal.\\",14,Color.LTGRAY);\\n    }\\n    private TextView text(LinearLayout parent,String value,int size,int color) {\\n        TextView view = new TextView(this); view.setText(value); view.setTextSize(size); view.setTextColor(color); view.setPadding(0,12,0,16); parent.addView(view); return view;\\n    }\\n    private Button button(Linea'
              'rLayout parent,String label) {\\n        Button b = new Button(this); b.setText(label); b.setAllCaps(false); parent.addView(b,new LinearLayout.LayoutParams(-1,-2)); return b;\\n    }\\n    private void requestCapture() {\\n        requesting=true; start.setEnabled(false);\\n        try { startActivityForResult(((MediaProjectionManager)getSystemService(MEDIA_PROJECTION_SERVICE)).createScreenCaptureIntent(),10); }\\n        catch (RuntimeException e) { requesting=false; CaptureService.status=\\"Não foi p'
              'ossível abrir a autorização: \\" + e.getClass().getSimpleName(); }\\n    }\\n    @Override public void onRequestPermissionsResult(int code,String[] permissions,int[] results) {\\n        super.onRequestPermissionsResult(code,permissions,results);\\n        if(code==12) requestCapture();\\n    }\\n    @Override protected void onActivityResult(int request,int result,Intent data) {\\n        super.onActivityResult(request,result,data);\\n        if(request!=10) return;\\n        requesting=false;\\n        if'
              '(result!=RESULT_OK || data==null) { CaptureService.status=\\"Autorização cancelada. Nenhuma captura iniciada.\\"; return; }\\n        Intent service = new Intent(this,CaptureService.class).putExtra(\\"result\\",result).putExtra(\\"consent\\",data);\\n        try { startForegroundService(service); }\\n        catch(RuntimeException e) { CaptureService.status=\\"Não foi possível iniciar: \\" + e.getClass().getSimpleName(); }\\n    }\\n    @Override protected void onResume() { super.onResume(); handler.post(ref'
              'resh); }\\n    @Override protected void onPause() { handler.removeCallbacks(refresh); super.onPause(); }\\n}\\n", "app/src/main/java/br/com/erick/assistentejogos/CaptureService.java": "package br.com.erick.assistentejogos;\\n\\nimport android.app.*;\\nimport android.content.*;\\nimport android.content.pm.ServiceInfo;\\nimport android.graphics.PixelFormat;\\nimport android.hardware.display.*;\\nimport android.media.*;\\nimport android.media.projection.*;\\nimport android.os.*;\\nimport android.util.DisplayMet'
              'rics;\\n\\npublic class CaptureService extends Service {\\n    public static volatile boolean active=false;\\n    public static volatile long frames=0;\\n    public static volatile String status=\\"Sessão parada\\";\\n    private MediaProjection projection;\\n    private VirtualDisplay display;\\n    private ImageReader reader;\\n    private final Handler handler = new Handler(Looper.getMainLooper());\\n    private int density;\\n    private final MediaProjection.Callback callback = new MediaProjection.Callb'
              'ack() {\\n        @Override public void onStop() { status=\\"Sessão encerrada pelo Android.\\"; stopSelf(); }\\n        @Override public void onCapturedContentResize(int width,int height) {\\n            if(display==null || width<=0 || height<=0) return;\\n            try {\\n                ImageReader previous=reader;\\n                reader=makeReader(width,height);\\n                display.setSurface(null);\\n                display.resize(reader.getWidth(),reader.getHeight(),density);\\n            '
              '    display.setSurface(reader.getSurface());\\n                if(previous!=null) previous.close();\\n            } catch(RuntimeException e) { fail(e); }\\n        }\\n    };\\n    @Override public IBinder onBind(Intent intent) { return null; }\\n    @Override public int onStartCommand(Intent intent,int flags,int id) {\\n        if(intent==null || \\"STOP\\".equals(intent.getAction())) { stopSelf(); return START_NOT_STICKY; }\\n        if(active) return START_NOT_STICKY;\\n        Intent consent = Build.V'
              'ERSION.SDK_INT>=33 ? intent.getParcelableExtra(\\"consent\\",Intent.class) : intent.getParcelableExtra(\\"consent\\");\\n        if(consent==null) { stopSelf(); return START_NOT_STICKY; }\\n        try {\\n            NotificationManager manager=getSystemService(NotificationManager.class);\\n            manager.createNotificationChannel(new NotificationChannel(\\"capture\\",\\"Sessão de tela\\",NotificationManager.IMPORTANCE_LOW));\\n            PendingIntent stop=PendingIntent.getService(this,1,new Intent(t'
              'his,CaptureService.class).setAction(\\"STOP\\"),PendingIntent.FLAG_IMMUTABLE);\\n            PendingIntent open=PendingIntent.getActivity(this,2,new Intent(this,MainActivity.class),PendingIntent.FLAG_IMMUTABLE);\\n            Notification notification=new Notification.Builder(this,\\"capture\\")\\n                .setSmallIcon(android.R.drawable.ic_menu_view).setContentTitle(\\"Teste de tela ativo\\")\\n                .setContentText(\\"Quadros descartados. Toque em Parar para encerrar.\\").setOngoing(true'
              ')\\n                .setContentIntent(open).addAction(new Notification.Action.Builder(null,\\"Parar\\",stop).build()).build();\\n            if(Build.VERSION.SDK_INT>=29) startForeground(1,notification,ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);\\n            else startForeground(1,notification);\\n            projection=getSystemService(MediaProjectionManager.class).getMediaProjection(intent.getIntExtra(\\"result\\",Activity.RESULT_CANCELED),consent);\\n            if(projection==null) throw '
              'new IllegalStateException(\\"Sem autorização\\");\\n            projection.registerCallback(callback,handler);\\n            DisplayMetrics metrics=getResources().getDisplayMetrics(); density=metrics.densityDpi;\\n            reader=makeReader(metrics.widthPixels,metrics.heightPixels);\\n            frames=0;\\n            display=projection.createVirtualDisplay(\\"TesteAssistente\\",reader.getWidth(),reader.getHeight(),density,DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,reader.getSurface(),null,hand'
              'ler);\\n            active=true; status=\\"Captura autorizada • aguardando quadros\\";\\n        } catch(RuntimeException e) { fail(e); }\\n        return START_NOT_STICKY;\\n    }\\n    private ImageReader makeReader(int w,int h) {\\n        float scale=Math.min(1f,720f/Math.max(w,h));\\n        ImageReader next=ImageReader.newInstance(Math.max(1,Math.round(w*scale)),Math.max(1,Math.round(h*scale)),PixelFormat.RGBA_8888,2);\\n        next.setOnImageAvailableListener(source -> {\\n            try(Image ima'
              'ge=source.acquireLatestImage()) {\\n                if(image!=null) { frames++; status=\\"Recebendo quadros • nada salvo ou enviado\\"; }\\n            } catch(IllegalStateException e) { if(active) fail(e); }\\n        },handler);\\n        return next;\\n    }\\n    private void fail(RuntimeException e) { status=\\"Falha na captura: \\" + e.getClass().getSimpleName(); stopSelf(); }\\n    @Override public void onDestroy() {\\n        active=false;\\n        if(display!=null) { display.release(); display=null'
              '; }\\n        if(reader!=null) { reader.close(); reader=null; }\\n        if(projection!=null) { projection.unregisterCallback(callback); projection.stop(); projection=null; }\\n        if(!status.startsWith(\\"Falha\\")) status=\\"Sessão parada • captura encerrada\\";\\n        stopForeground(STOP_FOREGROUND_REMOVE);\\n        super.onDestroy();\\n    }\\n}\\n"}'
          )
          for name, content in files.items():
              dest = Path(name)
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_text(content)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Verificar e construir
        run: gradle --no-daemon lintDebug assembleDebug
      - name: Preparar instalador
        run: cp app/build/outputs/apk/debug/app-debug.apk assistente-jogos-0.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: assistente-jogos-0.1
          path: assistente-jogos-0.1.apk
          if-no-files-found: error
          retention-days: 7
